
name: Build UGM Calculator Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pillow pyinstaller

      - name: Build Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name "UGM-Calculator" --add-data "assets:assets" main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: UGM-Calculator-Windows-v0.2.0
          path: dist/UGM-Calculator.exe
          if-no-files-found: error
